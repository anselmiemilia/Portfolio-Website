<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Kunst – Emilia Anselmi" data-i18n="meta.desc.kunst">
    <title data-i18n="meta.title.kunst">Kunst | Emilia Anselmi</title>
    <link rel="icon" type="image/png" href="assets/logo/favicon.png">
    <link href="styles/main.css?v=66" rel="stylesheet">
  <script src="scripts/i18n.js?v=61" defer></script>
  <script src="scripts/nav.js?v=61" defer></script>
  <script src="scripts/cart.js?v=2" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo"><img src="assets/logo/LOGO_EA_web.png" alt="EA Logo" class="logo-default"><img src="assets/logo/LOGO_EA_rosa_web.png" alt="EA Logo" class="logo-hover"></a>
        <button class="nav-toggle" aria-label="Menü öffnen" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav>
            <a href="index.html"><span data-i18n="nav.home">Home</span></a>
            <a href="kunst.html"><span data-i18n="nav.kunst">Kunst</span></a>
            <a href="projekte.html"><span data-i18n="nav.projekte">Projekte</span></a>
            <a href="ueber-mich.html"><span data-i18n="nav.about">Über mich</span></a>
            <a href="index.html#kontakt"><span data-i18n="nav.kontakt">Kontakt</span></a>
            <span class="lang-toggle"><button type="button" class="lang-btn" data-lang="de">DE</button><span class="lang-sep">/</span><button type="button" class="lang-btn" data-lang="en">EN</button></span>
        </nav>
    </header>

  <main>
    <!-- Kunst Section -->
    <section class="kunst-section">

        <div class="kunst-tabs">
            <button class="kunst-tab active" data-tab="prints">Shop Prints</button>
            <button class="kunst-tab" data-tab="originals">Shop Originals</button>
        </div>

        <!-- Shop Prints -->
        <div class="kunst-content active" id="tab-prints">
            <div class="shop-prints-grid">
                <a href="shop/abendrosa-in-marrakesch.html" class="shop-prints-card">
                    <div class="shop-prints-img-wrap">
                        <img src="assets/kunst/abendrosainmarrakesch/abendrosainmarrakesch.jpg" alt="Abendrosa in Marrakesch">
                        <div class="shop-prints-overlay"><span>Abendrosa in Marrakesch</span></div>
                    </div>
                    <p class="shop-prints-caption">Abendrosa in Marrakesch</p>
                </a>
                <a href="shop/doce-sao-miguel.html" class="shop-prints-card">
                    <div class="shop-prints-img-wrap">
                        <img src="assets/kunst/docesaomiguel/docesaomiguel.jpg" alt="Doce São Miguel">
                        <div class="shop-prints-overlay"><span>Doce São Miguel</span></div>
                    </div>
                    <p class="shop-prints-caption">Doce São Miguel</p>
                </a>
                <a href="shop/sommer-sonne-baedala.html" class="shop-prints-card">
                    <div class="shop-prints-img-wrap">
                        <img src="assets/kunst/sommersonnebaedala/sommersonnebaedala.jpg" alt="Sommer, Sonne, Bädala">
                        <div class="shop-prints-overlay"><span>Sommer, Sonne, Bädala</span></div>
                    </div>
                    <p class="shop-prints-caption">Sommer, Sonne, Bädala</p>
                </a>
            </div>
        </div>

        <!-- Shop Originals -->
        <div class="kunst-content" id="tab-originals">
            <div class="coming-soon">Coming soon</div>
        </div>

    </section>

    
  </main>

  <!-- Footer -->
    <footer>
        <p>© 2026 Emilia Anselmi. <span data-i18n="footer.rights">Alle Rechte vorbehalten.</span> · <a href="impressum.html" data-i18n="footer.impressum">Impressum</a> · <a href="datenschutz.html" data-i18n="footer.datenschutz">Datenschutz</a> · <a href="agb.html" data-i18n="footer.agb">AGB</a> · <a href="widerrufsrecht.html" data-i18n="footer.widerruf">Widerrufsrecht</a></p>
    </footer>

    <script>
        document.querySelectorAll('.kunst-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.kunst-tab').forEach(function (t) { t.classList.remove('active'); });
                document.querySelectorAll('.kunst-content').forEach(function (c) { c.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>

</html>
